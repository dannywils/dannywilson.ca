<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050606" />
    <meta name="description" content="Danny Wilson — personal homepage." />
    <title>Danny Wilson</title>
    <script>document.documentElement.classList.add('js-portrait')</script>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/tuner.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="image" href="/assets/portrait.png" />
    <noscript><style>.portrait .fallback { visibility: visible; }</style></noscript>
    <script type="module" src="/main.mjs" onerror="document.documentElement.classList.add('portrait-unavailable')"></script>
  </head>
  <body>
    <canvas class="portrait-canvas" aria-hidden="true"></canvas>
    <main class="composition" data-phase="human">
      <section class="identity" aria-label="Danny Wilson, software developer">
        <h1 aria-label="Danny Wilson">
          <span class="name-line" aria-hidden="true"
            >D<span class="ai-letter" data-letter="A">A</span>NNY</span
          ><span class="name-line" aria-hidden="true"
            >W<span class="ai-letter" data-letter="I">I</span>LSON</span
          >
        </h1>
        <a class="email" href="mailto:danny@dannywilson.ca"
          >danny@dannywilson.ca</a
        >
      </section>
      <figure
        class="portrait"
        data-renderer="loading"
        role="img"
        aria-label="ASCII portrait of Danny, with short hair, rectangular glasses and a slight smile."
      >
        <img
          class="fallback"
          src="/assets/portrait-static.svg"
          alt=""
          aria-hidden="true"
        />
      </figure>
    </main>
    <div class="gather-cursor" aria-hidden="true"><svg viewBox="0 0 48 48"><path class="brush-marks" d="M8 16V8h8m16 0h8v8m0 16v8h-8m-16 0H8v-8"/><circle class="gather-track" cx="24" cy="24" r="21"/><circle class="gather-progress" cx="24" cy="24" r="21" pathLength="100"/></svg></div>
    <nav class="experience" aria-label="Portrait interaction" hidden>
      <p class="experience-hint">Assembling</p>
      <div class="scene-actions">
        <button type="button" data-scene="replay" aria-label="Replay entrance" title="Replay entrance"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1.7 7M4 4v6h6"/></svg><span>Replay</span></button>
        <button type="button" data-scene="reveal" aria-pressed="false" title="Reveal the complete portrait and name"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><span>Reveal</span></button>
        <a class="contact-link" href="mailto:danny@dannywilson.ca" aria-label="Contact Danny by email" title="Email Danny"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="m3 6 9 7 9-7"/></svg><span>Contact</span></a>
      </div>
    </nav>
  </body>
</html>
